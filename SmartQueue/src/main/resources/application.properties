spring.application.name=SmartQueue

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.format_sql=true


spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always


springdoc.swagger-ui.url=/v3/api-docs

security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME}
security.jwt.refresh.expiration-time=${SECURITY_JWT_REFRESH_EXPIRATION_TIME}


app.security.cookie-secure=${APP_COOKIE_SECURE:true}
